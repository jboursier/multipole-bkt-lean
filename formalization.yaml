automation:
  methods:
    - method: "agent"
      models:
        - "gpt-6.1-sol"
      framework: "Codex CLI (OpenAI)"
      tool_setup: >-
        Statement writing, proof development, audits of the statements against the paper and
        read-only reviews of the proofs against the written proofs, with Lean builds under
        leanprover/lean4:v4.35.0-rc2 and Mathlib v4.35.0-rc2.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local macOS and Linux machines"
      prompting_notes: >-
        Human-directed work. Each task fixed the statements to be proved and forbade changing
        them.
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Claude Opus 5.5 coordinated the agents, reviewed their work and prepared the release.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local Linux machine"
      prompting_notes: >-
        Human-directed work on author-specified statements.
  spend_usd: "not tracked"
  notes: >-
    The Lean code was written with AI assistance under the direction of the authors, who fixed
    the statements to be formalized. Every proof is checked by the Lean kernel, and the library
    contains no sorry and no custom axiom. The seven Mathlib-only comparator challenge files
    (MultipoleBKTAudit/*/Challenge.lean) each contain exactly one intentional statement-level
    sorry, which the corresponding Solution.lean proves and leanprover/comparator checks.
    Scott Armstrong shared the setup used for the formalization.

fidelity:
  divergences: >-
    The plane is the complex numbers. A configuration is c : Fin N -> C x C with
    c i = (x_i, y_i), so labels start at 0. The square [0, sqrt N]^2 and the logarithmic
    kernel are those of TwoComponentCoulomb. The mollifier is measurable, nonnegative, radial,
    bounded, zero outside the closed unit disc and of integral 1. Each O(.) term is explicit:
    there are C > 0 and lambda_0 in (0,1] such that for every lambda in (0, lambda_0) there is
    N_0(lambda) with the bound for every N >= N_0(lambda); the mollifier and p_0 are fixed
    first. Where the paper takes M large the statements give M_0 > 20 with the conclusion for
    every M >= M_0, and where it takes epsilon_0 small they give epsilon_1 with the conclusion
    for every epsilon_0 in (0, epsilon_1). N_0 is uniform in gamma in Theorem 2(4) and in the
    multipole profile in Propositions 4.62 and 5.43. In Theorem 2(6), lambda_0 and N_0 are
    chosen after C_0. The partition function is a lower Lebesgue integral in [0, infinity];
    0 < Z < infinity is concluded and log Z is the logarithm of its real value. Bounds on
    log P(E) are written as bounds on P(E). The stable matching is the greedy rule with
    lexicographic ties, and bad points of a configuration are those of its matched dipoles.
    The coefficients k^dip, m and k^mult are not definitions: the theorems assert families
    with the defining limits for every lambda in (0,1) and the bounds for lambda < lambda_0,
    and the Mayer series and the rate function are functions of the coefficients. Infinite
    sums are tsums whose absolute convergence each statement concludes. Infima are infima of
    images. Proposition 4.23 is stated, as in the revised version, for each size k <= p*(beta)
    and every M >= M_0(beta, k), for the activities that Theorems 1 and 2 use. Definitions are
    total and take Mathlib's conventional values outside the paper's ranges.

review:
  status: "agent-reviewed"
  reviewers:
    - "GPT-6.1 Sol, independent audits of every statement and definition against the paper"
    - "GPT-6.1 Sol, independent read-only reviews of the proofs against the written proofs"
  notes: >-
    Every proof is checked by the Lean kernel, and the seven statements have comparator pairs
    for replay by independent kernels through leanprover/comparator. The statements and the
    definitions they use were written before the proofs, audited against the paper by agents
    that did not write them, and approved by the authors in their exact Lean form. The proofs
    on the dependency path of the seven results were then compared, section by section, with
    the written proofs of the revised version, and the differences found were resolved in
    the Lean.

