version: "v0.4"

project:
  name: "Multipole and Berezinskii-Kosterlitz-Thouless transitions in the two-component plasma"
  description: >-
    A Lean 4 formalization of the paper "Multipole and Berezinskii-Kosterlitz-Thouless
    Transitions in the Two-component Plasma" by Jeanne Boursier and Sylvia Serfaty: the free
    energy expansion of the two-dimensional two-component plasma with smeared charges in
    terms of dipole activities and the Mayer series (Theorem 1), and the multipole
    distribution, with the rate function, the expansion of the free energy through its
    minimum, the control of large multipoles and long dipoles, large deviations for the
    multipole counts, the unique minimizer and the typical number of multipoles (Theorem 2),
    for every beta > 2. The five intermediate results on which their proofs rest,
    Propositions 4.23, 4.62, 5.43 and 5.45 and Lemma 5.46, are proved in the form the main
    theorems use; Proposition 4.23 is stated for the three activities that Theorems 1 and 2
    use. The development imports Mathlib and the companion formalization TwoComponentCoulomb.
    The seven results have Mathlib-only comparator pairs under MultipoleBKTAudit/.
  authors:
    - "Jeanne Boursier"
    - "Sylvia Serfaty"
  responsible_maintainers:
    - "Jeanne Boursier"
  license: "Apache-2.0"

classification:
  arxiv: ["math-ph", "math.PR"]
  msc2020: ["82B05", "82B21", "82B26", "60F10"]

sources:
  - title: "Multipole and Berezinskii-Kosterlitz-Thouless Transitions in the Two-component Plasma"
    authors:
      - "Jeanne Boursier"
      - "Sylvia Serfaty"
    type: "paper"
    relationship: "formalizes"
    location: "https://arxiv.org/abs/2509.09449"
    note: >-
      Revised version (2026). The repository uses its numbering: Theorems 1 and 2,
      Propositions 4.23, 4.62, 5.43 and 5.45, and Lemma 5.46. The encodings are described
      under fidelity.divergences and in the README.
    license: "author's copyright"
    author_endorsement: "participated"
  - title: "Dipole formation in the two-component plasma"
    authors:
      - "Jeanne Boursier"
      - "Sylvia Serfaty"
    type: "paper"
    relationship: "background"
    location: "https://arxiv.org/abs/2410.01025"
    note: >-
      Companion paper. Its formalization is imported as the Lake package TwoComponentCoulomb
      from https://github.com/serfatysylvia/two-component-coulomb-dipoles-dev at commit
      ea3906a5850aaece11adee4b5562041e7512cfb6. This repository uses its square, its
      logarithmic kernel and its proved potential-theory and integration lemmas.
    license: "author's copyright"
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/serfatysylvia/two-component-coulomb-dipoles-dev"
    relationship: "builds-on"
    revision: "ea3906a5850aaece11adee4b5562041e7512cfb6"
    note: "Imported as the Lake package TwoComponentCoulomb, with all its proofs."

